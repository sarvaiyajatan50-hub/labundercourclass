<title>CSS FILTER EXAMPLE</title>
	<style>
		img{
			width: 300px;
			filter: grayscale(100%);
			transition: 0.5s;
		   }
			img: hover {
			filter: grayscale(0%)	brightness(120%);
           }
	</style>	
</head>
	<body>
		<h1>CSS FILTER PROPERTY</h1>
		<img scr="sarvaiya.jpg" alt="sarvaiya">	
	</body>
